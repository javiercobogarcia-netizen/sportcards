<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Carta — SportCards</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>


<div class="nav">
  <a href="/collection" class="nav-back">‹</a>
  <h1 id="nav-title">Carta</h1>
  <button onclick="toggleEdit()" id="btn-edit" style="background:none;border:none;color:white;font-size:22px;cursor:pointer" title="Editar">✏️</button>
</div>


<!-- MODAL EDICIÓN -->
<div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;overflow-y:auto;padding:16px">
  <div style="background:white;border-radius:16px;padding:20px;max-width:560px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:18px;color:var(--red)">✏️ Editar carta</h2>
      <button onclick="toggleEdit()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#666">×</button>
    </div>


    <div class="form-group"><label>Jugador *</label><input type="text" id="e-player"></div>
    <div class="form-row">
      <div class="form-group"><label>Deporte</label>
        <select id="e-sport">
          <option value="">—</option>
          <option>fútbol</option><option>baloncesto</option><option>béisbol</option>
          <option>fútbol americano</option><option>hockey</option><option>golf</option><option>otro</option>
        </select>
      </div>
      <div class="form-group"><label>Equipo</label><input type="text" id="e-team"></div>

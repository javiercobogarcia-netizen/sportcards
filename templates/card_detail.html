<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Carta &#8212; SportCards</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div class="nav">
  <a href="/collection" class="nav-back">&#8249;</a>
  <h1 id="nav-title">Carta</h1>
  <button onclick="toggleEdit()" id="btn-edit" style="background:none;border:none;color:white;font-size:22px;cursor:pointer" title="Editar">&#9999;&#65039;</button>
</div>

<!-- MODAL EDITAR VENTA -->
<div id="edit-sale-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;overflow-y:auto;padding:16px">
  <div style="background:white;border-radius:16px;padding:20px;max-width:400px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:18px;color:var(--red)">&#9999;&#65039; Editar venta</h2>
      <button onclick="toggleEditSale()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#666">&#215;</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Precio de venta (&#8364;)</label>
        <input type="number" id="es-price" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label>Fecha de venta</label>
        <input type="date" id="es-date">
      </div>
    </div>
    <div id="edit-sale-alert"></div>
    <button class="btn btn-primary" onclick="saveEditSale()">&#128190; Guardar venta</button>
  </div>
</div>

<!-- MODAL EDICI&#211;N -->
<div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;overflow-y:auto;padding:16px">
  <div style="background:white;border-radius:16px;padding:20px;max-width:560px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:18px;color:var(--red)">&#9999;&#65039; Editar carta</h2>
      <button onclick="toggleEdit()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#666">&#215;</button>
    </div>

    <div class="form-group"><label>Jugador *</label><input type="text" id="e-player"></div>
    <div class="form-row">
      <div class="form-group"><label>Deporte</label>
        <select id="e-sport">
          <option value="">&#8212;</option>
          <option>f&#250;tbol</option><option>baloncesto</option><option>b&#233;isbol</option>
          <option>f&#250;tbol americano</option><option>hockey</option><option>golf</option><option>otro</option>
        </select>
      </div>
      <div class="form-group"><label>Equipo</label><input type="text" id="e-team"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>A&#241;o</label><input type="number" id="e-year"></div>
      <div class="form-group"><label>N&#186; carta</label><input type="text" id="e-card-number"></div>
    </div>
    <div class="form-group"><label>Set / Colecci&#243;n</label><input type="text" id="e-set"></div>
    <div class="form-group"><label>Variante</label><input type="text" id="e-variant"></div>
    <div class="form-group"><label>Numeraci&#243;n (solo el n&#250;mero, ej: 25)</label><input type="text" id="e-numbering" placeholder="25"></div>
    <div class="form-group"><label>&#191;Gradada?</label>
      <select id="e-graded" onchange="document.getElementById('e-grade-fields').style.display=this.value==='1'?'block':'none'">
        <option value="0">No</option><option value="1">S&#237;</option>
      </select>
    </div>
    <div id="e-grade-fields" style="display:none">
      <div class="form-row">
        <div class="form-group"><label>Empresa</label>
          <select id="e-grading-company"><option>PSA</option><option>BGS</option><option>SGC</option><option>CGC</option></select>
        </div>
        <div class="form-group"><label>Nota</label><input type="text" id="e-grade"></div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Precio compra (&#8364;)</label><input type="number" id="e-price" step="0.01" min="0"></div>
      <div class="form-group"><label>Fecha compra</label><input type="date" id="e-date"></div>
    </div>
    <div class="form-group"><label>Notas</label><textarea id="e-notes" rows="2"></textarea></div>

    <div style="border-top:1px solid #eee;margin:16px 0;padding-top:16px">
      <p style="font-size:13px;font-weight:600;margin-bottom:10px">&#128248; Cambiar fotos (opcional)</p>
      <input type="file" id="e-inp-front" accept="image/*" style="display:none" onchange="previewEditPhoto(this,'front')">
      <input type="file" id="e-inp-back" accept="image/*" style="display:none" onchange="previewEditPhoto(this,'back')">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="text-align:center">
          <div id="e-prev-front" style="min-height:80px;border:2px dashed #ddd;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;overflow:hidden">
            <span style="font-size:12px;color:#999">Sin cambios</span>
          </div>
          <button type="button" onclick="document.getElementById('e-inp-front').click()" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;background:#f5f5f5;font-size:13px;cursor:pointer">&#128247; Delantera</button>
        </div>
        <div style="text-align:center">
          <div id="e-prev-back" style="min-height:80px;border:2px dashed #ddd;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;overflow:hidden">
            <span style="font-size:12px;color:#999">Sin cambios</span>
          </div>
          <button type="button" onclick="document.getElementById('e-inp-back').click()" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;background:#f5f5f5;font-size:13px;cursor:pointer">&#128247; Trasera</button>
        </div>
      </div>
    </div>

    <div style="margin:12px 0">
      <label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer">
        <input type="checkbox" id="e-personal" style="width:18px;height:18px;accent-color:var(--red)">
        Colecci&#243;n personal (excluir de avisos de antig&#252;edad)
      </label>
    </div>

    <div id="edit-alert"></div>
    <button class="btn btn-primary" onclick="saveEdit()">&#128190; Guardar cambios</button>
  </div>
</div>

<div class="container" id="content">
  <div class="loading"><div class="spinner"></div><p>Cargando...</p></div>
</div>

<nav class="bottom-nav">
  <a href="/"><span>&#127968;</span><span>Inicio</span></a>
  <a href="/collection"><span>&#128218;</span><span>Colecci&#243;n</span></a>
  <a href="/add" class="add-btn"><span>&#10133;</span><span>A&#241;adir</span></a>
</nav>

<script>
const CARD_ID = {{ card_id }};
let card = null;

async function load() {
  const r = await fetch(`/api/card/${CARD_ID}`);
  if (!r.ok) { document.getElementById('content').innerHTML = '<div class="alert alert-error">Carta no encontrada</div>'; return; }
  card = await r.json();
  document.getElementById('nav-title').textContent = card.player;
  render();
}

function render() {
  const c = card;
  let photosHtml = '';
  if (c.photo_front || c.photo_back) {
    photosHtml = `<div class="card-photos">
      ${c.photo_front ? `<img src="/${c.photo_front}" alt="Delantera">` : ''}
      ${c.photo_back ? `<img src="/${c.photo_back}" alt="Trasera">` : ''}
    </div>`;
  }

  const purchase = c.purchase_price || 0;
  const market = c.market_price || 0;
  const sale = c.sale_price || 0;

  let financialHtml = '';
  if (c.status === 'sold') {
    const profit = sale - purchase;
    const roi = purchase ? ((profit / purchase) * 100).toFixed(1) : 0;
    financialHtml = `
      <div class="detail-row"><span class="detail-label">Precio compra</span><span class="detail-value">${purchase.toFixed(2)} &#8364;</span></div>
      <div class="detail-row"><span class="detail-label">Precio venta</span><span class="detail-value">${sale.toFixed(2)} &#8364;</span></div>
      <div class="detail-row"><span class="detail-label">Fecha venta</span><span class="detail-value">${c.sale_date || '&#8212;'}</span></div>
      <div class="detail-row"><span class="detail-label">Beneficio</span><span class="detail-value ${profit>=0?'roi-positive':'roi-negative'}">${profit>=0?'+':''}${profit.toFixed(2)} &#8364;</span></div>
      <div class="detail-row"><span class="detail-label">ROI</span><span class="detail-value ${profit>=0?'roi-positive':'roi-negative'}">${profit>=0?'+':''}${roi}%</span></div>`;
  } else {
    const latent = market ? market - purchase : null;
    financialHtml = `
      <div class="detail-row"><span class="detail-label">Precio compra</span><span class="detail-value">${purchase.toFixed(2)} &#8364;</span></div>
      <div class="detail-row"><span class="detail-label">Fecha compra</span><span class="detail-value">${c.purchase_date || '&#8212;'}</span></div>
      <div class="detail-row"><span class="detail-label">Precio de mercado</span><span class="detail-value">${market ? market.toFixed(2)+' &#8364;' : '&#8212;'}</span></div>
      ${market ? `<div class="detail-row"><span class="detail-label">Beneficio latente</span><span class="detail-value ${latent>=0?'roi-positive':'roi-negative'}">${latent>=0?'+':''}${latent.toFixed(2)} &#8364; (${((latent/purchase)*100).toFixed(1)}%)</span></div>` : ''}
      ${c.market_price_updated ? `<div class="detail-row"><span class="detail-label">Precio actualizado</span><span class="detail-value" style="font-size:12px;color:#999">${c.market_price_updated}</span></div>` : ''}`;
  }

  const qrHtml = c.qr_code ? `
    <div class="detail-section">
      <h2>&#128241; C&#243;digo QR</h2>
      <div class="qr-container">
        <img src="/${c.qr_code}" alt="QR">
        <p style="font-size:12px;color:#999;margin-top:8px">Escanea para ver esta carta</p>
        <a href="/${c.qr_code}" download class="btn btn-secondary btn-sm" style="margin-top:12px;display:inline-block">&#11015;&#65039; Descargar QR</a>
      </div>
    </div>` : '';

  const sellHtml = c.status === 'owned' ? `
    <div class="detail-section" id="sell-section">
      <h2>&#128184; Vender carta</h2>
      <div id="sell-alert"></div>
      <div class="form-row">
        <div class="form-group">
          <label>Precio de venta (&#8364;)</label>
          <input type="number" id="sell-price" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>Fecha de venta</label>
          <input type="date" id="sell-date" value="${new Date().toISOString().split('T')[0]}">
        </div>
      </div>
      <button class="btn btn-success" onclick="sellCard()">&#9989; Registrar venta</button>
    </div>` : `
    <div class="detail-section">
      <h2>&#128295; Acciones de venta</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-secondary" onclick="toggleEditSale()">&#9999;&#65039; Editar precio/fecha venta</button>
        <button class="btn" style="background:#fff3cd;color:#856404;border:1px solid #ffc107" onclick="unsellCard()">&#8617;&#65039; Desmarcar como vendida</button>
      </div>
    </div>`;

  const deleteHtml = `
    <div class="detail-section" style="margin-top:8px">
      <button class="btn" style="background:#ffebee;color:#c62828;border:1px solid #ef9a9a;width:100%" onclick="deleteCard()">&#128465;&#65039; Borrar carta permanentemente</button>
    </div>`;

  document.getElementById('content').innerHTML = `
    ${photosHtml}

    <div class="detail-section">
      <h2>&#128100; Jugador</h2>
      <div class="detail-row"><span class="detail-label">Nombre</span><span class="detail-value">${c.player}</span></div>
      ${c.sport ? `<div class="detail-row"><span class="detail-label">Deporte</span><span class="detail-value capitalize">${c.sport}</span></div>` : ''}
      ${c.team ? `<div class="detail-row"><span class="detail-label">Equipo</span><span class="detail-value">${c.team}</span></div>` : ''}
    </div>

    <div class="detail-section">
      <h2>&#127183; Carta</h2>
      ${c.year ? `<div class="detail-row"><span class="detail-label">A&#241;o</span><span class="detail-value">${c.year}</span></div>` : ''}
      ${c.set_name ? `<div class="detail-row"><span class="detail-label">Colecci&#243;n</span><span class="detail-value">${c.set_name}</span></div>` : ''}
      ${c.variant ? `<div class="detail-row"><span class="detail-label">Variante</span><span class="detail-value">${c.variant}</span></div>` : ''}
      ${c.card_number ? `<div class="detail-row"><span class="detail-label">N&#186; carta</span><span class="detail-value">${c.card_number}</span></div>` : ''}
      ${c.numbering ? `<div class="detail-row"><span class="detail-label">Numeraci&#243;n</span><span class="detail-value">/${String(c.numbering).replace(/^\/+/,'')}</span></div>` : ''}
      ${c.graded ? `<div class="detail-row"><span class="detail-label">Gradeo</span><span class="detail-value"><span class="badge badge-graded">${c.grading_company} ${c.grade}</span></span></div>` : ''}
    </div>

    <div class="detail-section">
      <h2>&#128182; Dinero</h2>
      ${financialHtml}
    </div>

    ${c.status === 'owned' ? `
    <div class="detail-section">
      <h2>&#128200; Precio de mercado</h2>
      <p style="font-size:13px;color:#666;margin-bottom:12px">Busca el precio actual en eBay para esta carta.</p>
      <div id="market-alert"></div>
      <button class="btn btn-secondary" id="btn-market" onclick="fetchMarket()">&#128269; Actualizar precio eBay</button>
    </div>` : ''}

    ${qrHtml}
    ${sellHtml}

    ${c.notes ? `<div class="detail-section"><h2>&#128221; Notas</h2><p style="font-size:14px">${c.notes}</p></div>` : ''}
    ${deleteHtml}
  `;
}

async function fetchMarket() {
  const btn = document.getElementById('btn-market');
  btn.disabled = true;
  btn.textContent = 'Buscando en eBay...';
  const r = await fetch(`/api/card/${CARD_ID}/market-price`, {method:'POST'});
  const data = await r.json();
  btn.disabled = false;
  btn.textContent = '&#128269; Actualizar precio eBay';
  if (!r.ok) {
    document.getElementById('market-alert').innerHTML = `<div class="alert alert-error">&#9888;&#65039; ${data.error}</div>`;
    return;
  }
  document.getElementById('market-alert').innerHTML = `<div class="alert alert-success">&#9989; Precio medio: ${data.average} &#8364; (${data.samples} resultados en eBay) &#183; "${data.query}"</div>`;
  card.market_price = data.average;
  card.market_price_updated = data.updated;
  render();
}

async function sellCard() {
  const price = document.getElementById('sell-price').value;
  const date = document.getElementById('sell-date').value;
  if (!price) { document.getElementById('sell-alert').innerHTML = '<div class="alert alert-error">Introduce el precio de venta</div>'; return; }
  const r = await fetch(`/api/card/${CARD_ID}/sell`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({sale_price: parseFloat(price), sale_date: date})
  });
  const data = await r.json();
  if (!r.ok) { document.getElementById('sell-alert').innerHTML = `<div class="alert alert-error">${data.error}</div>`; return; }
  const msg = `&#9989; Vendida. Beneficio: ${data.profit >= 0 ? '+' : ''}${data.profit.toFixed(2)} &#8364; (ROI: ${data.roi}%)`;
  alert(msg);
  window.location.reload();
}

let editPhotos = { front: null, back: null };

function fixImageOrientation(file) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
    };
    img.src = url;
  });
}

function previewEditPhoto(input, side) {
  const file = input.files[0];
  if (!file) return;
  editPhotos[side] = file;
  const reader = new FileReader();
  reader.onload = e => {
    const prev = document.getElementById(`e-prev-${side}`);
    prev.innerHTML = `<img src="${e.target.result}" style="max-height:80px;max-width:100%;object-fit:contain">`;
  };
  reader.readAsDataURL(file);
}

function toggleEdit() {
  const modal = document.getElementById('edit-modal');
  if (modal.style.display === 'none') {
    editPhotos = { front: null, back: null };
    document.getElementById('e-prev-front').innerHTML = '<span style="font-size:12px;color:#999">Sin cambios</span>';
    document.getElementById('e-prev-back').innerHTML = '<span style="font-size:12px;color:#999">Sin cambios</span>';
    document.getElementById('e-inp-front').value = '';
    document.getElementById('e-inp-back').value = '';
    const c = card;
    document.getElementById('e-player').value = c.player || '';
    document.getElementById('e-sport').value = c.sport || '';
    document.getElementById('e-team').value = c.team || '';
    document.getElementById('e-year').value = c.year || '';
    document.getElementById('e-card-number').value = c.card_number || '';
    document.getElementById('e-set').value = c.set_name || '';
    document.getElementById('e-variant').value = c.variant || '';
    document.getElementById('e-numbering').value = c.numbering ? String(c.numbering).replace(/^\/+/,'') : '';
    document.getElementById('e-graded').value = c.graded ? '1' : '0';
    document.getElementById('e-grade-fields').style.display = c.graded ? 'block' : 'none';
    document.getElementById('e-grading-company').value = c.grading_company || 'PSA';
    document.getElementById('e-grade').value = c.grade || '';
    document.getElementById('e-price').value = c.purchase_price || '';
    document.getElementById('e-date').value = c.purchase_date || '';
    document.getElementById('e-notes').value = c.notes || '';
    document.getElementById('e-personal').checked = !!c.personal_collection;
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden';
  } else {
    modal.style.display = 'none';
    document.body.style.overflow = '';
  }
}

async function saveEdit() {
  const player = document.getElementById('e-player').value.trim();
  if (!player) { document.getElementById('edit-alert').innerHTML = '<div class="alert alert-error">El nombre es obligatorio</div>'; return; }
  const graded = parseInt(document.getElementById('e-graded').value);
  const payload = {
    player,
    sport: document.getElementById('e-sport').value || null,
    team: document.getElementById('e-team').value.trim() || null,
    year: parseInt(document.getElementById('e-year').value) || null,
    card_number: document.getElementById('e-card-number').value.trim() || null,
    set_name: document.getElementById('e-set').value.trim() || null,
    variant: document.getElementById('e-variant').value.trim() || null,
    numbering: document.getElementById('e-numbering').value.trim() || null,
    graded,
    grading_company: graded ? document.getElementById('e-grading-company').value : null,
    grade: graded ? document.getElementById('e-grade').value.trim() : null,
    purchase_price: parseFloat(document.getElementById('e-price').value) || null,
    purchase_date: document.getElementById('e-date').value || null,
    notes: document.getElementById('e-notes').value.trim() || null,
    personal_collection: document.getElementById('e-personal').checked ? 1 : 0,
  };
  const r = await fetch(`/api/card/${CARD_ID}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  if (!r.ok) { document.getElementById('edit-alert').innerHTML = '<div class="alert alert-error">Error al guardar</div>'; return; }

  if (editPhotos.front || editPhotos.back) {
    const fd = new FormData();
    if (editPhotos.front) {
      const blob = await fixImageOrientation(editPhotos.front);
      fd.append('front', blob, 'photo.jpg');
    }
    if (editPhotos.back) {
      const blob = await fixImageOrientation(editPhotos.back);
      fd.append('back', blob, 'photo.jpg');
    }
    const rp = await fetch(`/api/card/${CARD_ID}/photos`, {method:'POST', body:fd});
    if (!rp.ok) { document.getElementById('edit-alert').innerHTML = '<div class="alert alert-error">Error al subir fotos</div>'; return; }
  }

  toggleEdit(); await load();
}

async function unsellCard() {
  if (!confirm('&#191;Desmarcar esta carta como vendida? Se borrar&#225;n el precio y fecha de venta.')) return;
  const r = await fetch(`/api/card/${CARD_ID}/unsell`, {method:'POST'});
  if (!r.ok) { alert('Error al desmarcar la venta'); return; }
  window.location.reload();
}

async function deleteCard() {
  if (!confirm('&#191;Borrar esta carta permanentemente? Esta acci&#243;n no se puede deshacer.')) return;
  if (!confirm('&#191;Seguro? Se perder&#225;n todos los datos de esta carta.')) return;
  const r = await fetch(`/api/card/${CARD_ID}`, {method:'DELETE'});
  if (!r.ok) { alert('Error al borrar la carta'); return; }
  window.location.href = '/collection';
}

function toggleEditSale() {
  const modal = document.getElementById('edit-sale-modal');
  if (modal.style.display === 'none') {
    document.getElementById('es-price').value = card.sale_price || '';
    document.getElementById('es-date').value = card.sale_date || '';
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden';
  } else {
    modal.style.display = 'none';
    document.body.style.overflow = '';
  }
}

async function saveEditSale() {
  const price = document.getElementById('es-price').value;
  const date = document.getElementById('es-date').value;
  if (!price) { document.getElementById('edit-sale-alert').innerHTML = '<div class="alert alert-error">Introduce el precio de venta</div>'; return; }
  const r = await fetch(`/api/card/${CARD_ID}`, {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({sale_price: parseFloat(price), sale_date: date})
  });
  if (!r.ok) { document.getElementById('edit-sale-alert').innerHTML = '<div class="alert alert-error">Error al guardar</div>'; return; }
  toggleEditSale();
  await load();
}

load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Trades &#8212; SportCards</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
/* === TRADE MODAL === */
.trade-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  overflow-y: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}
.trade-modal-box {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 20px;
  max-width: 600px;
  margin: 0 auto;
  border: 1px solid #333;
}
.trade-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.trade-modal-title { font-size: 18px; font-weight: 700; color: var(--gold, #C9961A); }
.trade-modal-close {
  background: none;
  border: none;
  font-size: 28px;
  cursor: pointer;
  color: #888;
  line-height: 1;
  padding: 0 4px;
}

/* === CARD PICKER === */
.card-picker { margin-bottom: 4px; }
.card-picker-search {
  position: relative;
}
.card-picker-search input {
  width: 100%;
  padding: 11px 14px 11px 38px;
  border: 1.5px solid #333;
  border-radius: 50px;
  font-size: 14px;
  background: #111;
  color: #fff;
  outline: none;
  transition: border-color 0.2s;
}
.card-picker-search input:focus { border-color: var(--gold, #C9961A); }
.card-picker-search::before {
  content: '\1F50D';
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  pointer-events: none;
}
.card-picker-results {
  display: none;
  position: absolute;
  left: 0; right: 0;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 12px;
  margin-top: 4px;
  z-index: 10;
  max-height: 220px;
  overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.card-picker-results.open { display: block; }
.picker-result-item {
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.picker-result-item:last-child { border-bottom: none; }
.picker-result-item:hover, .picker-result-item:active { background: #252525; }
.picker-result-item.already-added { opacity: 0.4; pointer-events: none; }
.picker-result-name { font-size: 14px; font-weight: 600; color: #fff; }
.picker-result-meta { font-size: 12px; color: #888; margin-top: 2px; }
.picker-result-price { font-size: 13px; font-weight: 600; color: var(--gold, #C9961A); flex-shrink: 0; margin-left: 8px; }
.picker-no-results { padding: 14px; text-align: center; color: #666; font-size: 13px; }

/* === SELECTED CHIPS === */
.card-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; min-height: 0; }
.card-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #222;
  border: 1px solid #333;
  border-radius: 20px;
  padding: 6px 10px 6px 12px;
  font-size: 13px;
  animation: chipIn 0.15s ease;
}
.card-chip-name { font-weight: 600; color: #fff; }
.card-chip-price { color: var(--gold, #C9961A); font-size: 12px; }
.card-chip-remove {
  background: none;
  border: none;
  color: #666;
  font-size: 16px;
  cursor: pointer;
  line-height: 1;
  padding: 0;
  margin-left: 2px;
  transition: color 0.15s;
}
.card-chip-remove:hover { color: #f87171; }
@keyframes chipIn { from { opacity:0; transform:scale(0.85); } to { opacity:1; transform:scale(1); } }

/* === TRADE SECTIONS === */
.trade-section {
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 14px;
  border: 1px solid #2a2a2a;
}
.trade-section-give { background: #1a0e0e; border-color: #3a1a1a; }
.trade-section-receive { background: #0e1a0e; border-color: #1a3a1a; }
.trade-section-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.trade-section-give .trade-section-title { color: #f87171; }
.trade-section-receive .trade-section-title { color: #4ade80; }
.trade-section-total { font-size: 12px; font-weight: 400; }
.trade-section-give .trade-section-total { color: #f87171; }
.trade-section-receive .trade-section-total { color: #4ade80; }

/* RECEIVE TABS */
.receive-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.receive-tab {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  border: 1.5px solid #333;
  background: #111;
  color: #888;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.receive-tab.active { background: #162116; border-color: #4ade80; color: #4ade80; }

/* NEW CARD FORM */
.new-card-form { display: none; }
.new-card-form.open { display: block; }

/* PROFIT CARD */
.profit-card {
  background: #111;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 14px;
  text-align: center;
  margin-bottom: 14px;
}
.profit-label { font-size: 12px; color: #888; margin-bottom: 4px; }
.profit-value { font-size: 26px; font-weight: 700; }
</style>
</head>
<body>

<div class="nav">
  <a href="/" class="nav-back">&#8249;</a>
  <h1>Trades</h1>
  <button onclick="showNewTrade()" style="background:none;border:none;color:white;font-size:22px;cursor:pointer" title="Nuevo trade">&#43;</button>
</div>

<!-- MODAL NUEVO TRADE -->
<div id="trade-modal" class="trade-modal-overlay">
  <div class="trade-modal-box">

    <div class="trade-modal-header">
      <div class="trade-modal-title">&#8644; Nuevo trade</div>
      <button class="trade-modal-close" onclick="hideNewTrade()">&#215;</button>
    </div>

    <div class="form-row">
      <div class="form-group"><label>Fecha</label><input type="date" id="t-date"></div>
      <div class="form-group"><label>Con qui&#233;n (opcional)</label><input type="text" id="t-counterpart" placeholder="Nombre o usuario"></div>
    </div>
    <div class="form-group"><label>Notas</label><textarea id="t-notes" rows="2" placeholder="Detalles del trade..."></textarea></div>

    <!-- CARTAS QUE ENTREGO -->
    <div class="trade-section trade-section-give">
      <div class="trade-section-title">
        <span>&#128228; Cartas que entrego</span>
        <span class="trade-section-total">Total: <span id="give-total">0.00 &#8364;</span></span>
      </div>
      <!-- Buscador multi-selecci&#243;n -->
      <div class="card-picker" style="position:relative">
        <div class="card-picker-search">
          <input type="text" id="give-search" placeholder="Buscar carta de mi colecci&#243;n..." autocomplete="off" oninput="filterCards('give')" onfocus="filterCards('give')" onblur="hideResults('give', 200)">
        </div>
        <div id="give-results" class="card-picker-results"></div>
      </div>
      <div id="give-chips" class="card-chips"></div>
    </div>

    <!-- CARTAS QUE RECIBO -->
    <div class="trade-section trade-section-receive">
      <div class="trade-section-title">
        <span>&#128229; Cartas que recibo</span>
        <span class="trade-section-total">Total: <span id="receive-total">0.00 &#8364;</span></span>
      </div>
      <div class="receive-tabs">
        <button class="receive-tab active" id="tab-collection" onclick="switchReceiveTab('collection')">&#128218; De mi colecci&#243;n</button>
        <button class="receive-tab" id="tab-new" onclick="switchReceiveTab('new')">&#43; Nueva carta</button>
      </div>

      <!-- Buscador colecci&#243;n (recibir) -->
      <div id="receive-collection-picker">
        <div class="card-picker" style="position:relative">
          <div class="card-picker-search">
            <input type="text" id="receive-search" placeholder="Buscar carta que recibo..." autocomplete="off" oninput="filterCards('receive')" onfocus="filterCards('receive')" onblur="hideResults('receive', 200)">
          </div>
          <div id="receive-results" class="card-picker-results"></div>
        </div>
        <div id="receive-chips" class="card-chips"></div>
      </div>

      <!-- Alta nueva carta -->
      <div id="receive-new-form" class="new-card-form">
        <div class="form-row">
          <div class="form-group">
            <label>Jugador *</label>
            <input type="text" id="new-player" placeholder="Nombre del jugador" oninput="updateNewCardReceive()">
          </div>
          <div class="form-group">
            <label>A&#241;o</label>
            <input type="text" id="new-year" placeholder="2024">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Set / Colecci&#243;n</label>
            <input type="text" id="new-set" placeholder="Panini Mosaic...">
          </div>
          <div class="form-group">
            <label>Valor estimado (&#8364;)</label>
            <input type="number" id="new-value" placeholder="0.00" step="0.01" min="0" oninput="updateNewCardReceive()">
          </div>
        </div>
        <button type="button" class="btn btn-secondary" style="font-size:13px;margin-top:4px" onclick="searchEbayNew()">&#128269; Buscar precio en eBay</button>
        <div id="new-ebay-result" style="font-size:12px;color:#4ade80;margin-top:6px"></div>
      </div>
    </div>

    <!-- BENEFICIO -->
    <div class="profit-card">
      <div class="profit-label">Beneficio del trade</div>
      <div class="profit-value" id="trade-profit">0.00 &#8364;</div>
    </div>

    <div id="trade-alert"></div>
    <button class="btn btn-primary" onclick="saveTrade()">&#128190; Guardar trade</button>
  </div>
</div>

<div class="container">
  <div id="trades-list">
    <div class="loading"><div class="spinner"></div><p>Cargando trades...</p></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="/"><span>&#127968;</span><span>Inicio</span></a>
  <a href="/collection"><span>&#128218;</span><span>Colecci&#243;n</span></a>
  <a href="/add" class="add-btn"><span>&#43;</span><span>A&#241;adir</span></a>
  <a href="/trades" class="active"><span>&#8644;</span><span>Trades</span></a>
  <a href="/stats"><span>&#128200;</span><span>Stats</span></a>
</nav>

<script>
let ownedCards = [];
let giveSelected = [];    // [{card_id, player, value}]
let receiveSelected = []; // [{card_id, player, value, is_new}]
let newCardReceive = { player: '', year: '', set: '', value: 0 };
let receiveTab = 'collection';

async function init() {
  const r = await fetch('/api/cards?status=owned');
  ownedCards = await r.json();
  loadTrades();
}

// ========== BUSCADOR MULTI-SELECCION ==========

function filterCards(side) {
  const query = document.getElementById(side + '-search').value.trim().toLowerCase();
  const resultsEl = document.getElementById(side + '-results');

  const selected = side === 'give' ? giveSelected : receiveSelected.filter(c => !c.is_new);
  const selectedIds = selected.map(c => c.card_id);

  let filtered = ownedCards;
  if (query) {
    filtered = ownedCards.filter(c =>
      (c.player || '').toLowerCase().includes(query) ||
      (c.set_name || '').toLowerCase().includes(query) ||
      (c.team || '').toLowerCase().includes(query)
    );
  }

  if (!filtered.length) {
    resultsEl.innerHTML = '<div class="picker-no-results">No se encontraron cartas</div>';
    resultsEl.classList.add('open');
    return;
  }

  resultsEl.innerHTML = filtered.slice(0, 12).map(c => {
    const alreadyAdded = selectedIds.includes(c.id);
    const price = c.purchase_price ? c.purchase_price.toFixed(2) + ' &#8364;' : '&#8212;';
    const meta = [c.year, c.set_name, c.team].filter(Boolean).join(' &#183; ');
    return `<div class="picker-result-item ${alreadyAdded ? 'already-added' : ''}" onmousedown="selectCard('${side}', ${c.id})">
      <div>
        <div class="picker-result-name">${c.player}</div>
        ${meta ? `<div class="picker-result-meta">${meta}</div>` : ''}
      </div>
      <div class="picker-result-price">${alreadyAdded ? '&#10003;' : price}</div>
    </div>`;
  }).join('');
  resultsEl.classList.add('open');
}

function hideResults(side, delay) {
  setTimeout(() => {
    const el = document.getElementById(side + '-results');
    if (el) el.classList.remove('open');
  }, delay);
}

function selectCard(side, cardId) {
  const card = ownedCards.find(c => c.id === cardId);
  if (!card) return;

  if (side === 'give') {
    if (giveSelected.find(c => c.card_id === cardId)) return;
    giveSelected.push({ card_id: card.id, player: card.player, value: card.purchase_price || 0, set_name: card.set_name || '' });
    document.getElementById('give-search').value = '';
    document.getElementById('give-results').classList.remove('open');
    renderChips('give');
  } else {
    if (receiveSelected.find(c => !c.is_new && c.card_id === cardId)) return;
    receiveSelected.push({ card_id: card.id, player: card.player, value: card.purchase_price || 0, set_name: card.set_name || '', is_new: false });
    document.getElementById('receive-search').value = '';
    document.getElementById('receive-results').classList.remove('open');
    renderChips('receive');
  }
  updateTotals();
}

function renderChips(side) {
  const items = side === 'give' ? giveSelected : receiveSelected.filter(c => !c.is_new);
  const chipsEl = document.getElementById(side + '-chips');
  chipsEl.innerHTML = items.map((c, i) => {
    const price = c.value ? c.value.toFixed(2) + ' &#8364;' : '&#8212;';
    return `<div class="card-chip">
      <div>
        <span class="card-chip-name">${c.player}</span>
        ${c.set_name ? `<span style="color:#666;font-size:11px"> &#183; ${c.set_name}</span>` : ''}
        <span class="card-chip-price"> ${price}</span>
      </div>
      <button class="card-chip-remove" onmousedown="removeChip('${side}', ${c.card_id})" title="Quitar">&times;</button>
    </div>`;
  }).join('');
}

function removeChip(side, cardId) {
  if (side === 'give') {
    giveSelected = giveSelected.filter(c => c.card_id !== cardId);
    renderChips('give');
  } else {
    receiveSelected = receiveSelected.filter(c => c.is_new || c.card_id !== cardId);
    renderChips('receive');
  }
  updateTotals();
}

// ========== TABS RECIBIR ==========

function switchReceiveTab(tab) {
  receiveTab = tab;
  document.getElementById('tab-collection').classList.toggle('active', tab === 'collection');
  document.getElementById('tab-new').classList.toggle('active', tab === 'new');
  document.getElementById('receive-collection-picker').style.display = tab === 'collection' ? '' : 'none';
  document.getElementById('receive-new-form').classList.toggle('open', tab === 'new');
}

function updateNewCardReceive() {
  newCardReceive.player = (document.getElementById('new-player').value || '').trim();
  newCardReceive.value = parseFloat(document.getElementById('new-value').value) || 0;
  updateTotals();
}

async function searchEbayNew() {
  const player = document.getElementById('new-player').value.trim();
  const set = document.getElementById('new-set').value.trim();
  if (!player) { alert('Introduce el jugador primero'); return; }
  const btn = document.querySelector('#receive-new-form .btn');
  btn.textContent = 'Buscando...';
  btn.disabled = true;
  try {
    const r = await fetch('/api/ebay-search', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ player, set_name: set })
    });
    const data = await r.json();
    if (r.ok && data.average) {
      document.getElementById('new-value').value = data.average.toFixed(2);
      newCardReceive.value = data.average;
      document.getElementById('new-ebay-result').textContent = '&#9989; eBay: ' + data.average.toFixed(2) + ' &#8364; (' + data.samples + ' ventas)';
      updateTotals();
    } else {
      document.getElementById('new-ebay-result').textContent = 'Sin resultados. Introduce el valor manualmente.';
    }
  } catch(e) {
    document.getElementById('new-ebay-result').textContent = 'Error al conectar con eBay.';
  }
  btn.textContent = '&#128269; Buscar precio en eBay';
  btn.disabled = false;
}

// ========== TOTALES ==========

function updateTotals() {
  const giveTotal = giveSelected.reduce((s, c) => s + (c.value || 0), 0);

  let receiveTotal = receiveSelected.filter(c => !c.is_new).reduce((s, c) => s + (c.value || 0), 0);
  if (receiveTab === 'new') receiveTotal += newCardReceive.value || 0;

  const profit = receiveTotal - giveTotal;
  document.getElementById('give-total').textContent = giveTotal.toFixed(2) + ' &#8364;';
  document.getElementById('receive-total').textContent = receiveTotal.toFixed(2) + ' &#8364;';
  const el = document.getElementById('trade-profit');
  el.textContent = (profit >= 0 ? '+' : '') + profit.toFixed(2) + ' &#8364;';
  el.style.color = profit >= 0 ? '#4ade80' : '#f87171';
}

// ========== MODAL ==========

function showNewTrade() {
  giveSelected = [];
  receiveSelected = [];
  newCardReceive = { player: '', year: '', set: '', value: 0 };
  document.getElementById('give-chips').innerHTML = '';
  document.getElementById('receive-chips').innerHTML = '';
  document.getElementById('give-search').value = '';
  document.getElementById('receive-search').value = '';
  document.getElementById('give-results').classList.remove('open');
  document.getElementById('receive-results').classList.remove('open');
  document.getElementById('new-player').value = '';
  document.getElementById('new-year').value = '';
  document.getElementById('new-set').value = '';
  document.getElementById('new-value').value = '';
  document.getElementById('new-ebay-result').textContent = '';
  document.getElementById('t-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('t-counterpart').value = '';
  document.getElementById('t-notes').value = '';
  document.getElementById('trade-alert').innerHTML = '';
  switchReceiveTab('collection');
  updateTotals();
  document.getElementById('trade-modal').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function hideNewTrade() {
  document.getElementById('trade-modal').style.display = 'none';
  document.body.style.overflow = '';
}

// ========== GUARDAR ==========

async function saveTrade() {
  const alertEl = document.getElementById('trade-alert');
  alertEl.innerHTML = '';

  const give = giveSelected.filter(c => c.card_id);

  let receive = receiveSelected.filter(c => !c.is_new);
  if (receiveTab === 'new' && newCardReceive.player) {
    receive.push({
      player: newCardReceive.player,
      description: document.getElementById('new-set').value.trim(),
      value: newCardReceive.value,
      card_id: null,
      is_new: true
    });
  }

  if (!give.length && !receive.length) {
    alertEl.innerHTML = '<div class="alert alert-error">A&#241;ade al menos una carta al trade</div>';
    return;
  }

  const payload = {
    trade_date: document.getElementById('t-date').value,
    counterpart: document.getElementById('t-counterpart').value.trim() || null,
    notes: document.getElementById('t-notes').value.trim() || null,
    give,
    receive,
  };

  const r = await fetch('/api/trades', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  if (!r.ok) {
    alertEl.innerHTML = '<div class="alert alert-error">Error al guardar el trade</div>';
    return;
  }
  hideNewTrade();
  loadTrades();
  const r2 = await fetch('/api/cards?status=owned');
  ownedCards = await r2.json();
}

// ========== LISTA DE TRADES ==========

async function loadTrades() {
  const r = await fetch('/api/trades');
  const trades = await r.json();
  const container = document.getElementById('trades-list');
  if (!trades.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">&#8644;</div><p>A&#250;n no tienes trades.<br>Pulsa + para registrar uno.</p></div>';
    return;
  }
  container.innerHTML = trades.map(t => {
    const profit = (t.receive_value || 0) - (t.give_value || 0);
    const cls = profit >= 0 ? 'roi-positive' : 'roi-negative';
    const giveList = t.cards.filter(c => c.direction === 'give');
    const receiveList = t.cards.filter(c => c.direction === 'receive');
    return `<div class="card-item" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:13px;color:#888">${t.trade_date || 'Sin fecha'}${t.counterpart ? ' &#183; con ' + t.counterpart : ''}</div>
        <div class="${cls}" style="font-size:17px;font-weight:700">${profit >= 0 ? '+' : ''}${profit.toFixed(2)} &#8364;</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <div style="font-size:11px;font-weight:700;color:#f87171;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px">Entrego</div>
          ${giveList.map(c => `<div style="font-size:13px;margin-bottom:3px">${c.player || c.description || '&#8212;'} <span style="color:#888;font-size:12px">${c.value ? c.value.toFixed(2)+'&#8364;' : ''}</span></div>`).join('')}
          <div style="font-size:12px;color:#f87171;margin-top:4px;font-weight:600">${(t.give_value||0).toFixed(2)} &#8364;</div>
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;color:#4ade80;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px">Recibo</div>
          ${receiveList.map(c => `<div style="font-size:13px;margin-bottom:3px">${c.player || c.description || '&#8212;'} <span style="color:#888;font-size:12px">${c.value ? c.value.toFixed(2)+'&#8364;' : ''}</span></div>`).join('')}
          <div style="font-size:12px;color:#4ade80;margin-top:4px;font-weight:600">${(t.receive_value||0).toFixed(2)} &#8364;</div>
        </div>
      </div>
      ${t.notes ? `<div style="font-size:12px;color:#666;margin-top:10px;padding-top:10px;border-top:1px solid #222">${t.notes}</div>` : ''}
    </div>`;
  }).join('');
}

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#111111">
<title>SportCards</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div class="nav">
  <a href="/logout" class="nav-logo" title="Cerrar sesión">JC</a>
  <h1>SPORT CARDS</h1>
  <a href="/api/export" style="color:white;font-size:20px;text-decoration:none" title="Exportar Excel">📊</a>
</div>

<div class="container">

  <div class="home-stats" id="home-stats">
    <div class="home-stat">
      <div class="home-stat-val" id="hs-cards">—</div>
      <div class="home-stat-lbl">Cartas</div>
    </div>
    <div class="home-stat">
      <div class="home-stat-val blue" id="hs-value">—</div>
      <div class="home-stat-lbl">Valor</div>
    </div>
    <div class="home-stat">
      <div class="home-stat-val" id="hs-roi">—</div>
      <div class="home-stat-lbl">ROI</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
    <a href="/collection" class="home-btn home-btn-dark">
      <div class="home-btn-icon">📚</div>
      <div class="home-btn-label">Colección</div>
      <div class="home-btn-sub" id="owned-count">Ver todas</div>
    </a>
    <a href="/add" class="home-btn home-btn-gold">
      <div class="home-btn-icon">➕</div>
      <div class="home-btn-label">Añadir carta</div>
      <div class="home-btn-sub">Foto o manual</div>
    </a>
    <a href="/trades" class="home-btn home-btn-dark">
      <div class="home-btn-icon">🔄</div>
      <div class="home-btn-label">Trades</div>
      <div class="home-btn-sub">Intercambios</div>
    </a>
    <a href="/stats" class="home-btn home-btn-dark">
      <div class="home-btn-icon">📈</div>
      <div class="home-btn-label">Estadísticas</div>
      <div class="home-btn-sub">ROI · beneficio</div>
    </a>
  </div>

  <div id="alerts-section" style="margin-bottom:16px"></div>

  <div class="section-header">
    <span class="section-title">Últimas añadidas</span>
    <a href="/collection" class="section-link">Ver todas →</a>
  </div>
  <div id="recent-cards" class="recent-grid"></div>

  <div id="other-users-section" style="display:none;margin-top:24px">
    <div class="section-header">
      <span class="section-title">👥 Otros usuarios</span>
    </div>
    <div id="other-users-list"></div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="/" class="active"><span>🏠</span><span>Inicio</span></a>
  <a href="/collection"><span>📚</span><span>Colección</span></a>
  <a href="/add" class="add-btn"><span>➕</span><span>Añadir</span></a>
  <a href="/trades"><span>🔄</span><span>Trades</span></a>
  <a href="/stats"><span>📈</span><span>Stats</span></a>
</nav>

<script>
async function loadStats() {
  const r = await fetch('/api/stats');
  const s = await r.json();
  document.getElementById('hs-cards').textContent = s.owned || 0;
  document.getElementById('owned-count').textContent = (s.owned || 0) + ' en posesión';
  const val = s.current_value || 0;
  document.getElementById('hs-value').textContent = '€' + Math.round(val).toLocaleString('es');
  const bought = s.total_invested || 0;
  const roiEl = document.getElementById('hs-roi');
  if (bought > 0) {
    const roi = ((val - bought) / bought * 100);
    roiEl.textContent = (roi >= 0 ? '+' : '') + roi.toFixed(1) + '%';
    roiEl.className = 'home-stat-val ' + (roi >= 0 ? 'green' : 'red');
  } else {
    roiEl.textContent = '—';
  }
}

async function loadRecent() {
  const r = await fetch('/api/cards?status=owned');
  const cards = await r.json();
  const container = document.getElementById('recent-cards');
  const recent = cards.slice(0, 6);
  if (!recent.length) {
    container.outerHTML = '<div class="empty-state"><div class="icon">🃏</div><p>Aún no tienes cartas.</p><a href="/add" class="btn btn-primary" style="max-width:240px;margin:0 auto">Añadir primera carta</a></div>';
    return;
  }
  container.innerHTML = recent.map(c => {
    const img = c.photo_front
      ? `<img src="/${c.photo_front}" loading="lazy" alt="">`
      : '<span style="font-size:24px">🃏</span>';
    return `<a href="/card/${c.id}" class="recent-mini">
      <div class="recent-mini-img">${img}</div>
      <div class="recent-mini-name">${c.player}</div>
    </a>`;
  }).join('');
}

async function loadOtherUsers() {
  const r = await fetch('/api/users');
  const users = await r.json();
  if (!users.length) return;
  document.getElementById('other-users-section').style.display = '';
  document.getElementById('other-users-list').innerHTML = users.map(u =>
    `<a href="/user/${u.username}" class="btn btn-secondary" style="margin-bottom:8px;display:flex;align-items:center;gap:8px;justify-content:space-between">
      <span>📚 Colección de <strong>${u.username}</strong></span>
      <span style="color:#555">›</span>
    </a>`
  ).join('');
}

async function loadAlerts() {
  const r = await fetch('/api/alerts');
  const data = await r.json();
  const sec = document.getElementById('alerts-section');
  const alerts = [];
  if (data.old_cards_count > 0) {
    const names = data.old_cards.slice(0, 3).map(c => c.player).join(', ');
    const extra = data.old_cards_count > 3 ? ` y ${data.old_cards_count - 3} más` : '';
    alerts.push(`<div class="alert alert-info">
      <strong>⚠️ ${data.old_cards_count} carta${data.old_cards_count>1?'s':''} con más de 6 meses</strong>
      <div style="font-size:12px;margin-top:4px;color:#aaa">${names}${extra}</div>
      <a href="/collection" style="font-size:12px;color:var(--gold);font-weight:600;display:inline-block;margin-top:4px">Ver colección →</a>
    </div>`);
  }
  sec.innerHTML = alerts.join('');
}

loadStats();
loadRecent();
loadOtherUsers();
loadAlerts();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>

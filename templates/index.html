<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#111111">
<title>SportCards</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div class="nav">
  <div class="nav-brand">
    <div class="nav-logo-icon">SC</div>
    <span class="nav-title">SportCards</span>
  </div>
  <div class="nav-actions">
    <a href="/api/export" class="nav-action-btn" title="Exportar Excel">&#128202;</a>
    <a href="/logout" class="nav-avatar" title="Cerrar sesi&#243;n">JC</a>
  </div>
</div>

<div class="container">

  <div class="value-card" id="value-card">
    <div class="value-card-label">Valor de tu colecci&#243;n</div>
    <div class="value-card-amount" id="total-value">&#8212;</div>
    <div class="value-card-sub" id="value-sub">Cargando...</div>
  </div>

  <div class="home-grid">
    <a href="/collection" class="home-btn home-btn-dark" id="btn-collection">
      <span class="home-btn-icon">&#128218;</span>
      <span class="home-btn-label">Colecci&#243;n</span>
      <span class="home-btn-sub" id="lbl-collection">&#8212; cartas</span>
    </a>
    <a href="/add" class="home-btn home-btn-gold">
      <span class="home-btn-icon">&#43;</span>
      <span class="home-btn-label">A&#241;adir carta</span>
      <span class="home-btn-sub">Foto o manual</span>
    </a>
    <a href="/trades" class="home-btn home-btn-dark" id="btn-trades">
      <span class="home-btn-icon">&#8644;</span>
      <span class="home-btn-label">Trades</span>
      <span class="home-btn-sub" id="lbl-trades">&#8212;</span>
    </a>
    <a href="/stats" class="home-btn home-btn-dark">
      <span class="home-btn-icon">&#128200;</span>
      <span class="home-btn-label">Estad&#237;sticas</span>
      <span class="home-btn-sub">Ver an&#225;lisis</span>
    </a>
  </div>

  <div id="alerts-section" style="margin-bottom:14px"></div>

  <div class="section-header">
    <span class="section-title">&#218;ltimas a&#241;adidas</span>
    <a href="/collection" class="section-link">Ver todo</a>
  </div>
  <div id="recent-cards"></div>

  <div id="other-users-section" style="display:none;margin-top:24px">
    <div class="section-header">
      <span class="section-title">Colecciones de otros usuarios</span>
    </div>
    <div id="other-users-list"></div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="/" class="active"><span>&#127968;</span><span>Inicio</span></a>
  <a href="/collection"><span>&#128218;</span><span>Colecci&#243;n</span></a>
  <a href="/add" class="add-btn"><span>&#43;</span><span>A&#241;adir</span></a>
  <a href="/trades"><span>&#8644;</span><span>Trades</span></a>
  <a href="/stats"><span>&#128200;</span><span>Stats</span></a>
</nav>

<script>
async function loadRecent() {
  const r = await fetch('/api/cards?status=owned');
  const cards = await r.json();
  const container = document.getElementById('recent-cards');
  const recent = cards.slice(0, 5);

  document.getElementById('lbl-collection').textContent = cards.length + ' cartas';

  const totalVal = cards.reduce((s, c) => s + (c.purchase_price || 0), 0);
  document.getElementById('total-value').textContent = totalVal.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' &#8364;';
  document.getElementById('value-sub').textContent = cards.length + ' cartas en colecci&#243;n';

  if (!recent.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">&#127183;</div><p>A&#250;n no tienes cartas.<br>A&#241;ade tu primera carta.</p><a href="/add" class="btn btn-primary" style="max-width:240px;margin:0 auto">A&#241;adir primera carta</a></div>';
    return;
  }
  container.innerHTML = recent.map(cardHTML).join('');
}

function cardHTML(c) {
  const thumb = c.photo_front
    ? `<img class="card-thumb" src="/${c.photo_front}" loading="lazy">`
    : `<div class="card-thumb-placeholder">&#127183;</div>`;
  const badges = [
    c.graded ? `<span class="badge badge-graded">${c.grading_company} ${c.grade}</span>` : '',
    c.numbering ? `<span class="badge badge-numbered">/${c.numbering}</span>` : '',
  ].filter(Boolean).join(' ');
  const price = c.purchase_price ? c.purchase_price.toFixed(2) + ' &#8364;' : '&#8212;';
  return `<a href="/card/${c.id}" class="card-item">
    ${thumb}
    <div class="card-info">
      <div class="card-player">${c.player}</div>
      <div class="card-meta">${[c.year, c.set_name, c.team].filter(Boolean).join(' &#183; ')}</div>
      ${badges ? `<div style="margin-bottom:4px">${badges}</div>` : ''}
      <div class="card-price">Compra: ${price}</div>
    </div>
    <span class="card-chevron">&#8250;</span>
  </a>`;
}

async function loadOtherUsers() {
  const r = await fetch('/api/users');
  const users = await r.json();
  if (!users.length) return;
  document.getElementById('other-users-section').style.display = '';
  document.getElementById('other-users-list').innerHTML = users.map(u =>
    `<a href="/user/${u.username}" class="card-item" style="text-decoration:none">
      <span style="font-size:22px">&#128218;</span>
      <div class="card-info"><div class="card-player">${u.username}</div><div class="card-meta">Ver colecci&#243;n</div></div>
      <span class="card-chevron">&#8250;</span>
    </a>`
  ).join('');
}

async function loadAlerts() {
  const r = await fetch('/api/alerts');
  const data = await r.json();
  const sec = document.getElementById('alerts-section');
  const alerts = [];
  if (data.old_cards_count > 0) {
    const names = data.old_cards.slice(0, 3).map(c => c.player).join(', ');
    const extra = data.old_cards_count > 3 ? ` y ${data.old_cards_count - 3} m&#225;s` : '';
    alerts.push(`<div class="alert-banner">
      <span class="alert-icon">&#9888;&#65039;</span>
      <div>
        <strong>${data.old_cards_count} carta${data.old_cards_count>1?'s':''} con m&#225;s de 6 meses</strong>
        <div style="font-size:12px;color:#999;margin-top:2px">${names}${extra}</div>
        <a href="/collection" class="alert-link">Ver colecci&#243;n &#8594;</a>
      </div>
    </div>`);
  }
  sec.innerHTML = alerts.join('');
}

async function loadTrades() {
  try {
    const r = await fetch('/api/trades');
    const trades = await r.json();
    const active = trades.filter(t => t.status === 'active').length;
    document.getElementById('lbl-trades').textContent = active ? active + ' activos' : 'Sin activos';
  } catch(e) {}
}

loadRecent();
loadOtherUsers();
loadAlerts();
loadTrades();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>

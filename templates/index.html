<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#111111">
<title>SportCards</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div class="nav">
  <a href="/logout" class="nav-logo" title="Cerrar sesión">JC</a>
  <h1>SPORT CARDS</h1>
  <a href="/api/export" style="color:white;font-size:20px;text-decoration:none" title="Exportar Excel">📊</a>
</div>

<div class="container">

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
    <a href="/collection" style="text-decoration:none;background:#dce8ff;border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;color:#1a4fa0">
      <span style="font-size:28px">📚</span>
      <span style="font-size:13px;font-weight:600">Colección</span>
    </a>
    <a href="/add" style="text-decoration:none;background:var(--red);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;color:white">
      <span style="font-size:28px">➕</span>
      <span style="font-size:13px;font-weight:600">Añadir carta</span>
    </a>
    <a href="/trades" style="text-decoration:none;background:#dce8ff;border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;color:#1a4fa0">
      <span style="font-size:28px">🔄</span>
      <span style="font-size:13px;font-weight:600">Trades</span>
    </a>
    <a href="/stats" style="text-decoration:none;background:#dce8ff;border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;color:#1a4fa0">
      <span style="font-size:28px">📈</span>
      <span style="font-size:13px;font-weight:600">Estadísticas</span>
    </a>
  </div>

  <div id="alerts-section" style="margin-bottom:16px"></div>

  <h2 style="margin-bottom:12px;font-size:16px;color:#666">Últimas añadidas</h2>
  <div id="recent-cards"></div>
  <a href="/collection" class="btn btn-secondary" style="margin-top:8px">Ver colección completa →</a>

  <div id="other-users-section" style="display:none;margin-top:24px">
    <h2 style="margin-bottom:12px;font-size:16px;color:#666">👥 Colecciones de otros usuarios</h2>
    <div id="other-users-list"></div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="/" class="active"><span>🏠</span><span>Inicio</span></a>
  <a href="/collection"><span>📚</span><span>Colección</span></a>
  <a href="/add" class="add-btn"><span>➕</span><span>Añadir</span></a>
  <a href="/trades"><span>🔄</span><span>Trades</span></a>
  <a href="/stats"><span>📈</span><span>Stats</span></a>
</nav>

<script>
async function loadRecent() {
  const r = await fetch('/api/cards?status=owned');
  const cards = await r.json();
  const container = document.getElementById('recent-cards');
  const recent = cards.slice(0, 5);
  if (!recent.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🃏</div><p>Aún no tienes cartas.<br>Añade tu primera carta.</p><a href="/add" class="btn btn-primary" style="max-width:240px;margin:0 auto">Añadir primera carta</a></div>';
    return;
  }
  container.innerHTML = recent.map(cardHTML).join('');
}

function cardHTML(c) {
  const thumb = c.photo_front
    ? `<img class="card-thumb" src="/${c.photo_front}" loading="lazy">`
    : `<div class="card-thumb-placeholder">🃏</div>`;
  const badges = [
    c.graded ? `<span class="badge badge-graded">${c.grading_company} ${c.grade}</span>` : '',
    c.numbering ? `<span class="badge badge-numbered">/${c.numbering}</span>` : '',
  ].filter(Boolean).join(' ');
  const price = c.purchase_price ? `${c.purchase_price.toFixed(2)} €` : '—';
  return `<a href="/card/${c.id}" class="card-item">
    ${thumb}
    <div class="card-info">
      <div class="card-player">${c.player}</div>
      <div class="card-meta">${[c.year, c.set_name, c.team].filter(Boolean).join(' · ')}</div>
      ${badges ? `<div style="margin-bottom:4px">${badges}</div>` : ''}
      <div class="card-price">Compra: ${price}</div>
    </div>
    <span style="color:#ccc;font-size:20px">›</span>
  </a>`;
}

async function loadOtherUsers() {
  const r = await fetch('/api/users');
  const users = await r.json();
  if (!users.length) return;
  document.getElementById('other-users-section').style.display = '';
  document.getElementById('other-users-list').innerHTML = users.map(u =>
    `<a href="/user/${u.username}" class="btn btn-secondary" style="margin-bottom:8px;display:flex;align-items:center;gap:8px;justify-content:space-between">
      <span>📚 Colección de <strong>${u.username}</strong></span>
      <span style="color:#ccc">›</span>
    </a>`
  ).join('');
}

async function loadAlerts() {
  const r = await fetch('/api/alerts');
  const data = await r.json();
  const sec = document.getElementById('alerts-section');
  const alerts = [];
  if (data.old_cards_count > 0) {
    const names = data.old_cards.slice(0, 3).map(c => c.player).join(', ');
    const extra = data.old_cards_count > 3 ? ` y ${data.old_cards_count - 3} más` : '';
    alerts.push(`<div style="background:#fff3cd;border:1px solid #ffc107;border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start">
      <span style="font-size:20px">⚠️</span>
      <div>
        <strong>Tienes ${data.old_cards_count} carta${data.old_cards_count>1?'s':''} con más de 6 meses en tu colección</strong>
        <div style="font-size:13px;color:#666;margin-top:4px">${names}${extra}</div>
        <a href="/collection" style="font-size:13px;color:#856404;font-weight:600">Ver colección →</a>
      </div>
    </div>`);
  }
  sec.innerHTML = alerts.join('');
}

loadRecent();
loadOtherUsers();
loadAlerts();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>

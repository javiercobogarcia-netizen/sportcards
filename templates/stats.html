<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Estadisticas - SportCards</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
.stat-big { background: white; border-radius: 14px; padding: 18px; margin-bottom: 12px; box-shadow: var(--shadow); }
.stat-big-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.stat-big-value { font-size: 28px; font-weight: 700; color: #222; }
.stat-big-value.red { color: var(--red); }
.stat-big-value.green { color: #2e7d32; }
.sport-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
.sport-row:last-child { border-bottom: none; }
.sport-bar { height: 6px; background: var(--red); border-radius: 3px; margin-top: 4px; }
.top-card { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.top-card:last-child { border-bottom: none; }
.top-card img { width: 40px; height: 55px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
.top-card-placeholder { width: 40px; height: 55px; background: #f0f0f0; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.gain-positive { color: #2e7d32; font-weight: 700; }
.gain-negative { color: #c62828; font-weight: 700; }
</style>
</head>
<body>

<div class="nav">
  <a href="/" class="nav-back">&#8249;</a>
  <h1>Estadisticas</h1>
  <span style="color:white;font-size:13px;opacity:.8">{{ username }}</span>
</div>

<div class="container" id="content">
  <div class="loading"><div class="spinner"></div><p>Cargando...</p></div>
</div>

<nav class="bottom-nav">
  <a href="/"><span>&#127968;</span><span>Inicio</span></a>
  <a href="/collection"><span>&#128218;</span><span>Coleccion</span></a>
  <a href="/add" class="add-btn"><span>&#10133;</span><span>Anadir</span></a>
  <a href="/trades"><span>&#128260;</span><span>Trades</span></a>
  <a href="/stats" class="active"><span>&#128200;</span><span>Stats</span></a>
</nav>

<script>
function fmt(v) {
  if (v === null || v === undefined) return '-';
  return parseFloat(v).toFixed(2) + ' EUR';
}

async function load() {
  const [r1, r2, r3, r4] = await Promise.all([
    fetch('/api/stats/detail'),
    fetch('/api/profit/periods'),
    fetch('/api/cards?status=owned'),
    fetch('/api/portfolio'),
  ]);
  const d = await r1.json();
  const periods = await r2.json();
  const allOwned = await r3.json();
  const port = await r4.json();
  const g = d.general;
  const sports = d.by_sport;
  const top = d.top_cards;

  const personal = allOwned.filter(c => c.personal_collection);
  const trading = allOwned.filter(c => !c.personal_collection);
  const sumInv = arr => arr.reduce((a, c) => a + (c.purchase_price || 0), 0);
  const sumVal = arr => arr.reduce((a, c) => a + (c.market_price || c.purchase_price || 0), 0);
  const pInv = sumInv(personal), pVal = sumVal(personal);
  const tInv = sumInv(trading), tVal = sumVal(trading);
  const pLatent = pVal - pInv, tLatent = tVal - tInv;

  const profit = g.total_profit || 0;
  const latent = (g.current_value || 0) - (g.total_invested || 0);
  const maxSport = sports.length ? Math.max(...sports.map(s => s.total)) : 1;

  const totalCost  = port.total_cost || 0;
  const totalValue = port.current_value || 0;
  const unrealized = port.unrealized_gain || 0;
  const realized   = port.realized_profit || 0;
  const roiPct     = totalCost ? ((totalValue - totalCost) / totalCost * 100) : 0;

  const topByValue = (port.top_by_value || []).map(c => {
    const val = c.value || 0;
    const gain = c.gain || 0;
    const grade = c.graded ? ` · ${c.grading_company} ${c.grade}` : '';
    return `<a href="/card/${c.id}" style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee;text-decoration:none;color:inherit">
      ${c.photo_front ? `<img src="/${c.photo_front}" style="width:36px;height:50px;object-fit:cover;border-radius:4px;flex-shrink:0">` : `<div style="width:36px;height:50px;background:#f0f0f0;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">&#127183;</div>`}
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.player}${grade}</div>
        <div style="font-size:11px;color:var(--text-muted)">${[c.year, c.set_name].filter(Boolean).join(' · ')}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-weight:700;color:var(--red)">${fmt(val)}</div>
        <div style="font-size:11px" class="${gain>=0?'gain-positive':'gain-negative'}">${gain>=0?'+':''}${fmt(gain)}</div>
      </div>
    </a>`;
  }).join('');

  const portHtml = `
    <div class="form-section" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h2 style="margin:0">&#128188; Cartera total</h2>
        <a href="/api/export/pdf" style="font-size:12px;color:var(--red);text-decoration:none;font-weight:600;background:#fff0f0;padding:4px 10px;border-radius:20px">&#128196; Exportar PDF</a>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
        <div class="stat-big" style="margin-bottom:0">
          <div class="stat-big-label">Coste invertido</div>
          <div class="stat-big-value" style="font-size:20px">${fmt(totalCost)}</div>
        </div>
        <div class="stat-big" style="margin-bottom:0">
          <div class="stat-big-label">Valor actual</div>
          <div class="stat-big-value red" style="font-size:20px">${fmt(totalValue)}</div>
        </div>
        <div class="stat-big" style="margin-bottom:0">
          <div class="stat-big-label">Ganancia latente</div>
          <div class="stat-big-value ${unrealized>=0?'green':'red'}" style="font-size:20px">${unrealized>=0?'+':''}${fmt(unrealized)}</div>
        </div>
        <div class="stat-big" style="margin-bottom:0">
          <div class="stat-big-label">ROI cartera</div>
          <div class="stat-big-value ${roiPct>=0?'green':'red'}" style="font-size:20px">${roiPct>=0?'+':''}${roiPct.toFixed(1)}%</div>
        </div>
        <div class="stat-big" style="margin-bottom:0">
          <div class="stat-big-label">Beneficio realizado</div>
          <div class="stat-big-value ${realized>=0?'green':'red'}" style="font-size:20px">${realized>=0?'+':''}${fmt(realized)}</div>
        </div>
        <div class="stat-big" style="margin-bottom:0">
          <div class="stat-big-label">Cartas (${port.owned||0} act · ${port.sold||0} vend)</div>
          <div class="stat-big-value" style="font-size:20px">${port.total_cards||0}</div>
        </div>
      </div>
      ${topByValue ? `<div style="margin-top:8px"><div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Top cartas por valor</div>${topByValue}</div>` : ''}
    </div>`;

  document.getElementById('content').innerHTML = portHtml + `
    <div class="form-section" style="margin-bottom:12px">
      <h2>&#128260; Trading</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="stat-big" style="margin-bottom:0"><div class="stat-big-label">Cartas</div><div class="stat-big-value red">${trading.length}</div></div>
        <div class="stat-big" style="margin-bottom:0"><div class="stat-big-label">Invertido</div><div class="stat-big-value" style="font-size:18px">${fmt(tInv)}</div></div>
        <div class="stat-big" style="margin-bottom:0"><div class="stat-big-label">Valor actual</div><div class="stat-big-value" style="font-size:18px">${fmt(tVal)}</div></div>
        <div class="stat-big" style="margin-bottom:0"><div class="stat-big-label">Plus/menos latente</div><div class="stat-big-value ${tLatent>=0?'green':'red'}" style="font-size:18px">${tLatent>=0?'+':''}${fmt(tLatent)}</div></div>
      </div>
    </div>
    <div class="form-section" style="margin-bottom:12px">
      <h2>&#127969; Coleccion personal</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="stat-big" style="margin-bottom:0"><div class="stat-big-label">Cartas</div><div class="stat-big-value red">${personal.length}</div></div>
        <div class="stat-big" style="margin-bottom:0"><div class="stat-big-label">Invertido</div><div class="stat-big-value" style="font-size:18px">${fmt(pInv)}</div></div>
        <div class="stat-big" style="margin-bottom:0"><div class="stat-big-label">Valor actual</div><div class="stat-big-value" style="font-size:18px">${fmt(pVal)}</div></div>
        <div class="stat-big" style="margin-bottom:0"><div class="stat-big-label">Plus/menos latente</div><div class="stat-big-value ${pLatent>=0?'green':'red'}" style="font-size:18px">${pLatent>=0?'+':''}${fmt(pLatent)}</div></div>
      </div>
    </div>
    <div class="stat-big" style="margin-bottom:4px">
      <div class="stat-big-label" style="margin-bottom:2px">Beneficio realizado (vendidas)</div>
      <div class="stat-big-value ${profit>=0?'green':'red'}" style="font-size:22px">${profit>=0?'+':''}${fmt(profit)}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px">${g.sold||0} cartas vendidas · ${g.total_cards||0} en total</div>
    </div>
    ${sports.length ? `<div class="form-section" style="margin-bottom:12px"><h2>Por deporte</h2>${sports.map(s => `<div class="sport-row"><div style="flex:1"><div style="font-weight:600;text-transform:capitalize">${s.sport}</div><div class="sport-bar" style="width:${Math.round((s.total/maxSport)*100)}%"></div></div><div style="text-align:right;margin-left:12px"><div style="font-weight:700;color:var(--red)">${s.total}</div><div style="font-size:11px;color:var(--text-muted)">${fmt(s.invested)}</div></div></div>`).join('')}</div>` : ''}
    ${top.length ? `<div class="form-section"><h2>Mejores inversiones actuales</h2>${top.map((c,i) => { const gain=(c.market_price||c.purchase_price||0)-(c.purchase_price||0); const roi=c.purchase_price?((gain/c.purchase_price)*100).toFixed(1):null; return `<a href="/card/${c.id}" class="top-card" style="text-decoration:none;color:inherit">${c.photo_front?`<img src="/${c.photo_front}" loading="lazy">`:`<div class="top-card-placeholder">&#127183;</div>`}<div style="flex:1"><div style="font-weight:600">${c.player}</div><div style="font-size:12px;color:var(--text-muted)">${[c.year,c.set_name].filter(Boolean).join(' · ')}</div></div><div style="text-align:right"><div class="${gain>=0?'gain-positive':'gain-negative'}">${gain>=0?'+':''}${fmt(gain)}</div>${roi?`<div style="font-size:11px;color:var(--text-muted)">${roi}%</div>`:''}</div></a>`; }).join('')}</div>` : ''}
    <div class="form-section" style="margin-bottom:12px">
      <h2>&#128197; Beneficio por periodo</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
        ${[{label:'Hoy',key:'today'},{label:'Esta semana',key:'week'},{label:'Este mes',key:'month'},{label:'Este trimestre',key:'quarter'},{label:'Este anio',key:'year'},{label:'Total historico',key:'all'}].map(({label,key}) => { const p=periods[key]||{}; const pf=p.profit||0; const cls=pf>=0?'green':'red'; return `<div class="stat-big" style="margin-bottom:0"><div class="stat-big-label">${label}</div><div class="stat-big-value ${cls}" style="font-size:20px">${pf>=0?'+':''}${fmt(pf)}</div><div style="font-size:11px;color:var(--text-muted)">${p.sold_count||0} venta${p.sold_count!==1?'s':''}</div></div>`; }).join('')}
      </div>
      ${periods.by_month&&periods.by_month.length?`<div><div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px">Ultimos 12 meses</div>${periods.by_month.map(m=>{const pf=m.profit||0;const cls=pf>=0?'gain-positive':'gain-negative';return`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)"><div style="font-size:13px">${m.month}</div><div style="text-align:right"><span class="${cls}" style="font-size:14px;font-weight:600">${pf>=0?'+':''}${fmt(pf)}</span><span style="font-size:11px;color:var(--text-muted);margin-left:6px">${m.sold_count} venta${m.sold_count!==1?'s':''}</span></div></div>`}).join('')}</div>`:`<div style="font-size:13px;color:var(--text-muted)">Sin ventas en los ultimos 12 meses</div>`}
    </div>
    ${d.by_player&&d.by_player.length?`<div class="form-section"><h2>Por jugador</h2>${d.by_player.map(p=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)"><div><div style="font-weight:600">${p.player}</div><div style="font-size:12px;color:var(--text-muted)">${p.total} carta${p.total!==1?'s':''} · ${p.owned} en posesion${p.sold?' · '+p.sold+' vendida'+(p.sold!==1?'s':''):''}</div></div><div style="text-align:right"><div style="font-size:13px;color:var(--red);font-weight:600">${fmt(p.total_invested)}</div>${p.profit?`<div style="font-size:11px" class="${p.profit>=0?'gain-positive':'gain-negative'}">${p.profit>=0?'+':''}${fmt(p.profit)}</div>`:''}</div></div>`).join('')}</div>`:''}
  `;
}

load();
</script>
</body>
</html>

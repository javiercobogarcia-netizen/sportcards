<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Carta — SportCards</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div class="nav">
  <a href="/collection" class="nav-back">‹</a>
  <h1 id="nav-title">Carta</h1>
  <button onclick="toggleEdit()" id="btn-edit" style="background:none;border:none;color:white;font-size:22px;cursor:pointer" title="Editar">✏️</button>
</div>

<!-- MODAL EDICIÓN -->
<div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;overflow-y:auto;padding:16px">
  <div style="background:white;border-radius:16px;padding:20px;max-width:560px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:18px;color:var(--red)">✏️ Editar carta</h2>
      <button onclick="toggleEdit()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#666">×</button>
    </div>

    <div class="form-group"><label>Jugador *</label><input type="text" id="e-player"></div>
    <div class="form-row">
      <div class="form-group"><label>Deporte</label>
        <select id="e-sport">
          <option value="">—</option>
          <option>fútbol</option><option>baloncesto</option><option>béisbol</option>
          <option>fútbol americano</option><option>hockey</option><option>otro</option>
        </select>
      </div>
      <div class="form-group"><label>Equipo</label><input type="text" id="e-team"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Año</label><input type="number" id="e-year"></div>
      <div class="form-group"><label>Nº carta</label><input type="text" id="e-card-number"></div>
    </div>
    <div class="form-group"><label>Set / Colección</label><input type="text" id="e-set"></div>
    <div class="form-group"><label>Variante</label><input type="text" id="e-variant"></div>
    <div class="form-group"><label>Numeración (solo el número, ej: 25)</label><input type="text" id="e-numbering" placeholder="25"></div>
    <div class="form-group"><label>¿Gradada?</label>
      <select id="e-graded" onchange="document.getElementById('e-grade-fields').style.display=this.value==='1'?'block':'none'">
        <option value="0">No</option><option value="1">Sí</option>
      </select>
    </div>
    <div id="e-grade-fields" style="display:none">
      <div class="form-row">
        <div class="form-group"><label>Empresa</label>
          <select id="e-grading-company"><option>PSA</option><option>BGS</option><option>SGC</option><option>CGC</option></select>
        </div>
        <div class="form-group"><label>Nota</label><input type="text" id="e-grade"></div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Precio compra (€)</label><input type="number" id="e-price" step="0.01" min="0"></div>
      <div class="form-group"><label>Fecha compra</label><input type="date" id="e-date"></div>
    </div>
    <div class="form-group"><label>Notas</label><textarea id="e-notes" rows="2"></textarea></div>

    <div style="border-top:1px solid #eee;margin:16px 0;padding-top:16px">
      <p style="font-size:13px;font-weight:600;margin-bottom:10px">📸 Cambiar fotos (opcional)</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">Delantera</label>
          <label id="e-area-front" style="display:block;border:2px dashed #ddd;border-radius:8px;min-height:80px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#999;text-align:center;padding:8px" for="e-inp-front">
            <input type="file" id="e-inp-front" accept="image/*" style="display:none" onchange="previewEditPhoto(this,'front')">
            <span id="e-label-front">📷 Cambiar</span>
          </label>
        </div>
        <div>
          <label style="font-size:12px;color:#666;display:block;margin-bottom:4px">Trasera</label>
          <label id="e-area-back" style="display:block;border:2px dashed #ddd;border-radius:8px;min-height:80px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#999;text-align:center;padding:8px" for="e-inp-back">
            <input type="file" id="e-inp-back" accept="image/*" style="display:none" onchange="previewEditPhoto(this,'back')">
            <span id="e-label-back">📷 Cambiar</span>
          </label>
        </div>
      </div>
    </div>

    <div id="edit-alert"></div>
    <button class="btn btn-primary" onclick="saveEdit()">💾 Guardar cambios</button>
  </div>
</div>

<div class="container" id="content">
  <div class="loading"><div class="spinner"></div><p>Cargando...</p></div>
</div>

<nav class="bottom-nav">
  <a href="/"><span>🏠</span><span>Inicio</span></a>
  <a href="/collection"><span>📚</span><span>Colección</span></a>
  <a href="/add" class="add-btn"><span>➕</span><span>Añadir</span></a>
</nav>

<script>
const CARD_ID = {{ card_id }};
let card = null;

async function load() {
  const r = await fetch(`/api/card/${CARD_ID}`);
  if (!r.ok) { document.getElementById('content').innerHTML = '<div class="alert alert-error">Carta no encontrada</div>'; return; }
  card = await r.json();
  document.getElementById('nav-title').textContent = card.player;
  render();
}

function render() {
  const c = card;
  let photosHtml = '';
  if (c.photo_front || c.photo_back) {
    photosHtml = `<div class="card-photos">
      ${c.photo_front ? `<img src="/${c.photo_front}" alt="Delantera">` : ''}
      ${c.photo_back ? `<img src="/${c.photo_back}" alt="Trasera">` : ''}
    </div>`;
  }

  const purchase = c.purchase_price || 0;
  const market = c.market_price || 0;
  const sale = c.sale_price || 0;

  let financialHtml = '';
  if (c.status === 'sold') {
    const profit = sale - purchase;
    const roi = purchase ? ((profit / purchase) * 100).toFixed(1) : 0;
    financialHtml = `
      <div class="detail-row"><span class="detail-label">Precio compra</span><span class="detail-value">${purchase.toFixed(2)} €</span></div>
      <div class="detail-row"><span class="detail-label">Precio venta</span><span class="detail-value">${sale.toFixed(2)} €</span></div>
      <div class="detail-row"><span class="detail-label">Fecha venta</span><span class="detail-value">${c.sale_date || '—'}</span></div>
      <div class="detail-row"><span class="detail-label">Beneficio</span><span class="detail-value ${profit>=0?'roi-positive':'roi-negative'}">${profit>=0?'+':''}${profit.toFixed(2)} €</span></div>
      <div class="detail-row"><span class="detail-label">ROI</span><span class="detail-value ${profit>=0?'roi-positive':'roi-negative'}">${profit>=0?'+':''}${roi}%</span></div>`;
  } else {
    const latent = market ? market - purchase : null;
    financialHtml = `
      <div class="detail-row"><span class="detail-label">Precio compra</span><span class="detail-value">${purchase.toFixed(2)} €</span></div>
      <div class="detail-row"><span class="detail-label">Fecha compra</span><span class="detail-value">${c.purchase_date || '—'}</span></div>
      <div class="detail-row"><span class="detail-label">Precio de mercado</span><span class="detail-value">${market ? market.toFixed(2)+' €' : '—'}</span></div>
      ${market ? `<div class="detail-row"><span class="detail-label">Beneficio latente</span><span class="detail-value ${latent>=0?'roi-positive':'roi-negative'}">${latent>=0?'+':''}${latent.toFixed(2)} € (${((latent/purchase)*100).toFixed(1)}%)</span></div>` : ''}
      ${c.market_price_updated ? `<div class="detail-row"><span class="detail-label">Precio actualizado</span><span class="detail-value" style="font-size:12px;color:#999">${c.market_price_updated}</span></div>` : ''}`;
  }

  const qrHtml = c.qr_code ? `
    <div class="detail-section">
      <h2>📱 Código QR</h2>
      <div class="qr-container">
        <img src="/${c.qr_code}" alt="QR">
        <p style="font-size:12px;color:#999;margin-top:8px">Escanea para ver esta carta</p>
        <a href="/${c.qr_code}" download class="btn btn-secondary btn-sm" style="margin-top:12px;display:inline-block">⬇️ Descargar QR</a>
      </div>
    </div>` : '';

  const sellHtml = c.status === 'owned' ? `
    <div class="detail-section" id="sell-section">
      <h2>💸 Vender carta</h2>
      <div id="sell-alert"></div>
      <div class="form-row">
        <div class="form-group">
          <label>Precio de venta (€)</label>
          <input type="number" id="sell-price" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>Fecha de venta</label>
          <input type="date" id="sell-date" value="${new Date().toISOString().split('T')[0]}">
        </div>
      </div>
      <button class="btn btn-success" onclick="sellCard()">✅ Registrar venta</button>
    </div>` : '';

  document.getElementById('content').innerHTML = `
    ${photosHtml}

    <div class="detail-section">
      <h2>👤 Jugador</h2>
      <div class="detail-row"><span class="detail-label">Nombre</span><span class="detail-value">${c.player}</span></div>
      ${c.sport ? `<div class="detail-row"><span class="detail-label">Deporte</span><span class="detail-value capitalize">${c.sport}</span></div>` : ''}
      ${c.team ? `<div class="detail-row"><span class="detail-label">Equipo</span><span class="detail-value">${c.team}</span></div>` : ''}
    </div>

    <div class="detail-section">
      <h2>🃏 Carta</h2>
      ${c.year ? `<div class="detail-row"><span class="detail-label">Año</span><span class="detail-value">${c.year}</span></div>` : ''}
      ${c.set_name ? `<div class="detail-row"><span class="detail-label">Colección</span><span class="detail-value">${c.set_name}</span></div>` : ''}
      ${c.variant ? `<div class="detail-row"><span class="detail-label">Variante</span><span class="detail-value">${c.variant}</span></div>` : ''}
      ${c.card_number ? `<div class="detail-row"><span class="detail-label">Nº carta</span><span class="detail-value">${c.card_number}</span></div>` : ''}
      ${c.numbering ? `<div class="detail-row"><span class="detail-label">Numeración</span><span class="detail-value">/${String(c.numbering).replace(/^\/+/,'')}</span></div>` : ''}
      ${c.graded ? `<div class="detail-row"><span class="detail-label">Gradeo</span><span class="detail-value"><span class="badge badge-graded">${c.grading_company} ${c.grade}</span></span></div>` : ''}
    </div>

    <div class="detail-section">
      <h2>💶 Dinero</h2>
      ${financialHtml}
    </div>

    ${c.status === 'owned' ? `
    <div class="detail-section">
      <h2>📈 Precio de mercado</h2>
      <p style="font-size:13px;color:#666;margin-bottom:12px">Busca el precio actual en eBay para esta carta.</p>
      <div id="market-alert"></div>
      <button class="btn btn-secondary" id="btn-market" onclick="fetchMarket()">🔍 Actualizar precio eBay</button>
    </div>` : ''}

    ${qrHtml}
    ${sellHtml}

    ${c.notes ? `<div class="detail-section"><h2>📝 Notas</h2><p style="font-size:14px">${c.notes}</p></div>` : ''}
  `;
}

async function fetchMarket() {
  const btn = document.getElementById('btn-market');
  btn.disabled = true;
  btn.textContent = 'Buscando en eBay...';
  const r = await fetch(`/api/card/${CARD_ID}/market-price`, {method:'POST'});
  const data = await r.json();
  btn.disabled = false;
  btn.textContent = '🔍 Actualizar precio eBay';
  if (!r.ok) {
    document.getElementById('market-alert').innerHTML = `<div class="alert alert-error">⚠️ ${data.error}</div>`;
    return;
  }
  document.getElementById('market-alert').innerHTML = `<div class="alert alert-success">✅ Precio medio: ${data.average} € (${data.samples} resultados en eBay) · "${data.query}"</div>`;
  card.market_price = data.average;
  card.market_price_updated = data.updated;
  render();
}

async function sellCard() {
  const price = document.getElementById('sell-price').value;
  const date = document.getElementById('sell-date').value;
  if (!price) { document.getElementById('sell-alert').innerHTML = '<div class="alert alert-error">Introduce el precio de venta</div>'; return; }
  const r = await fetch(`/api/card/${CARD_ID}/sell`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({sale_price: parseFloat(price), sale_date: date})
  });
  const data = await r.json();
  if (!r.ok) { document.getElementById('sell-alert').innerHTML = `<div class="alert alert-error">${data.error}</div>`; return; }
  const msg = `✅ Vendida. Beneficio: ${data.profit >= 0 ? '+' : ''}${data.profit.toFixed(2)} € (ROI: ${data.roi}%)`;
  alert(msg);
  window.location.reload();
}

let editPhotos = { front: null, back: null };

function previewEditPhoto(input, side) {
  const file = input.files[0];
  if (!file) return;
  editPhotos[side] = file;
  const reader = new FileReader();
  reader.onload = e => {
    const area = document.getElementById(`e-area-${side}`);
    area.innerHTML = `<input type="file" id="e-inp-${side}" accept="image/*" style="display:none" onchange="previewEditPhoto(this,'${side}')"><img src="${e.target.result}" style="max-height:80px;max-width:100%;border-radius:6px;object-fit:contain">`;
    area.setAttribute('for', `e-inp-${side}`);
  };
  reader.readAsDataURL(file);
}

function toggleEdit() {
  const modal = document.getElementById('edit-modal');
  if (modal.style.display === 'none') {
    editPhotos = { front: null, back: null };
    document.getElementById('e-label-front') && (document.getElementById('e-label-front').textContent = '📷 Cambiar');
    document.getElementById('e-label-back') && (document.getElementById('e-label-back').textContent = '📷 Cambiar');
    const c = card;
    document.getElementById('e-player').value = c.player || '';
    document.getElementById('e-sport').value = c.sport || '';
    document.getElementById('e-team').value = c.team || '';
    document.getElementById('e-year').value = c.year || '';
    document.getElementById('e-card-number').value = c.card_number || '';
    document.getElementById('e-set').value = c.set_name || '';
    document.getElementById('e-variant').value = c.variant || '';
    document.getElementById('e-numbering').value = c.numbering ? String(c.numbering).replace(/^\/+/,'') : '';
    document.getElementById('e-graded').value = c.graded ? '1' : '0';
    document.getElementById('e-grade-fields').style.display = c.graded ? 'block' : 'none';
    document.getElementById('e-grading-company').value = c.grading_company || 'PSA';
    document.getElementById('e-grade').value = c.grade || '';
    document.getElementById('e-price').value = c.purchase_price || '';
    document.getElementById('e-date').value = c.purchase_date || '';
    document.getElementById('e-notes').value = c.notes || '';
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden';
  } else {
    modal.style.display = 'none';
    document.body.style.overflow = '';
  }
}

async function saveEdit() {
  const player = document.getElementById('e-player').value.trim();
  if (!player) { document.getElementById('edit-alert').innerHTML = '<div class="alert alert-error">El nombre es obligatorio</div>'; return; }
  const graded = parseInt(document.getElementById('e-graded').value);
  const payload = {
    player,
    sport: document.getElementById('e-sport').value || null,
    team: document.getElementById('e-team').value.trim() || null,
    year: parseInt(document.getElementById('e-year').value) || null,
    card_number: document.getElementById('e-card-number').value.trim() || null,
    set_name: document.getElementById('e-set').value.trim() || null,
    variant: document.getElementById('e-variant').value.trim() || null,
    numbering: document.getElementById('e-numbering').value.trim() || null,
    graded,
    grading_company: graded ? document.getElementById('e-grading-company').value : null,
    grade: graded ? document.getElementById('e-grade').value.trim() : null,
    purchase_price: parseFloat(document.getElementById('e-price').value) || null,
    purchase_date: document.getElementById('e-date').value || null,
    notes: document.getElementById('e-notes').value.trim() || null,
  };
  const r = await fetch(`/api/card/${CARD_ID}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  if (!r.ok) { document.getElementById('edit-alert').innerHTML = '<div class="alert alert-error">Error al guardar</div>'; return; }

  if (editPhotos.front || editPhotos.back) {
    const fd = new FormData();
    if (editPhotos.front) fd.append('front', editPhotos.front, editPhotos.front.name || 'photo.jpg');
    if (editPhotos.back) fd.append('back', editPhotos.back, editPhotos.back.name || 'photo.jpg');
    const rp = await fetch(`/api/card/${CARD_ID}/photos`, {method:'POST', body:fd});
    if (!rp.ok) { document.getElementById('edit-alert').innerHTML = '<div class="alert alert-error">Error al subir fotos</div>'; return; }
  }

  toggleEdit(); await load();
}

load();
</script>
</body>
</html>
